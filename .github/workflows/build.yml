name: Build Windows EXE + Android APK + Render Linux Server

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: v1.0.0

jobs:
  # ───────────────────────── Khởi tạo Release ─────────────────────────
  init-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Khởi tạo GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Discord Auto-Reactor ${{ env.RELEASE_TAG }}"
          body: |
            ### Discord Auto-Reactor (Rust + Tauri v2 / Render Cloud)
            - **Android**: tải `DiscordReactor.apk` về điện thoại rồi mở để cài.
            - **Windows**: dùng `DiscordReactor-setup.exe` để cài đặt, hoặc `DiscordReactor-portable.exe` để chạy thẳng không cần cài.
            - **Render / Linux**: chạy trực tiếp file `discord-reactor-server` trên Linux/Docker hoặc deploy 1-click lên Render Free.
          token: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────── Linux Web Server (Render / Cloud) ─────────────────────────
  build-server:
    needs: [init-release]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-server

      - name: Biên dịch Linux Web Server
        working-directory: src-server
        run: cargo build --release

      - name: Gom file thực thi
        run: |
          mkdir -p dist
          cp src-server/target/release/discord-reactor-server dist/discord-reactor-server
          chmod +x dist/discord-reactor-server
          ls -lh dist/

      - name: Đăng Server Binary lên GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/discord-reactor-server
          token: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────── Android APK ─────────────────────────
  build-apk:
    needs: [init-release]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cài đặt Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cài đặt Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Thiết lập biến môi trường NDK
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Cài đặt Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Khởi tạo Android project
        working-directory: src-tauri
        run: cargo tauri android init

      - name: Thêm Foreground Service chạy nền
        run: python3 scripts/patch_android.py

      - name: Biên dịch Android APK (Release)
        working-directory: src-tauri
        run: cargo tauri android build --apk --target aarch64

      - name: Ký APK (để cài trực tiếp trên Android)
        run: |
          mkdir -p dist
          find src-tauri/gen/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} dist/DiscordReactor.apk \;
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android dist/DiscordReactor.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify dist/DiscordReactor.apk
          ls -lh dist/

      - name: Đăng APK lên GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/DiscordReactor.apk
          token: ${{ secrets.GITHUB_TOKEN }}

  # ───────────────────────── Windows EXE ─────────────────────────
  build-windows:
    needs: [init-release]
    runs-on: windows-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cài đặt Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Biên dịch (file .exe chạy thẳng + bộ cài NSIS)
        working-directory: src-tauri
        run: cargo tauri build --bundles nsis

      - name: Gom file đầu ra
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "src-tauri/target/release/discord-reactor.exe" "dist/DiscordReactor-portable.exe"
          Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | ForEach-Object {
            Copy-Item $_.FullName "dist/DiscordReactor-setup.exe"
          }
          Get-ChildItem dist

      - name: Đăng Windows EXE lên GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/DiscordReactor-portable.exe
            dist/DiscordReactor-setup.exe
          token: ${{ secrets.GITHUB_TOKEN }}

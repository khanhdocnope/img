name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài đặt Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cài đặt các gói phụ thuộc hệ thống cho Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache

      - name: Cài đặt Buildozer và Cython
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "cython<3.0.0"
          pip install git+https://github.com/kivy/buildozer.git@master

      - name: Biên dịch Android APK với Buildozer
        run: |
          buildozer -v android debug

      - name: Tải lên file APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiscordReactor-APK
          path: bin/*.apk
          retention-days: 7

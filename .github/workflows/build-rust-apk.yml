name: Build Rust Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cài đặt Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cài đặt Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Thiết lập biến môi trường NDK
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Cài đặt Tauri CLI
        run: |
          cargo install tauri-cli --version "^2.0.0" --locked

      - name: Khởi tạo Android project (nếu chưa có)
        working-directory: src-tauri
        run: |
          cargo tauri android init

      - name: Biên dịch Android APK (Release - Tối ưu dung lượng và tốc độ)
        working-directory: src-tauri
        run: |
          cargo tauri android build --apk --target aarch64

      - name: Ký chứng chỉ APK bằng apksigner (Để cài đặt trực tiếp trên Android)
        run: |
          mkdir -p release_apk
          find src-tauri/gen/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} release_apk/DiscordReactor.apk \;
          
          # Tạo chứng chỉ và ký file APK
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android release_apk/DiscordReactor.apk
          
          # Xác thực chữ ký
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify release_apk/DiscordReactor.apk
          ls -lh release_apk/

      - name: Đăng tải lên GitHub Releases (Tải trực tiếp tốc độ cao)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Discord Auto-Reactor v1.0.0 (Android APK)"
          body: |
            ### Ứng dụng Discord Auto-Reactor cho Android (Rust Tauri v2)
            - **Hiệu năng**: Viết bằng Rust 100%, tiêu thụ chỉ 15 - 35 MB RAM, không tốn pin khi chạy nền.
            - **Cài đặt**: Tải file `DiscordReactor.apk` bên dưới về điện thoại và mở lên để cài đặt trực tiếp.
          files: release_apk/DiscordReactor.apk
          token: ${{ secrets.GITHUB_TOKEN }}

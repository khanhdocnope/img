name: Build Rust Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cài đặt Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cài đặt Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Thiết lập biến môi trường NDK
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Cài đặt Tauri CLI
        run: |
          cargo install tauri-cli --version "^2.0.0" --locked

      - name: Khởi tạo Android project (nếu chưa có)
        working-directory: src-tauri
        run: |
          cargo tauri android init

      - name: Biên dịch Android APK (Release)
        working-directory: src-tauri
        run: |
          cargo tauri android build --apk --target aarch64

      - name: Tải lên file APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiscordReactor-Rust-APK
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/target/**/release/apk/*.apk
            src-tauri/target/**/*.apk
          retention-days: 7

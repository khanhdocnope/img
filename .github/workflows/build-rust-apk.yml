name: Build Rust Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cài đặt Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cài đặt Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Thiết lập biến môi trường NDK
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Cài đặt Tauri CLI
        run: |
          cargo install tauri-cli --version "^2.0.0" --locked

      - name: Khởi tạo Android project (nếu chưa có)
        working-directory: src-tauri
        run: |
          cargo tauri android init

      - name: Biên dịch Android APK (Tự động ký chứng chỉ Debug để cài ngay trên điện thoại)
        working-directory: src-tauri
        run: |
          cargo tauri android build --apk --target aarch64 --debug

      - name: Chuẩn bị file APK cài đặt
        id: prepare_apk
        run: |
          mkdir -p release_apk
          find src-tauri/gen/android/app/build/outputs/apk/ -name "*.apk" -exec cp {} release_apk/DiscordReactor.apk \;
          ls -lh release_apk/

      - name: Tạo link tải trực tiếp (Dự phòng khi hết dung lượng Artifact)
        run: |
          DIRECT_LINK=$(curl -s --upload-file release_apk/DiscordReactor.apk https://bashupload.com/DiscordReactor.apk | grep -o 'https://[^ ]*')
          echo "DIRECT_LINK=$DIRECT_LINK" >> $GITHUB_ENV
          echo "### 📱 LINK TẢI TRỰC TIẾP FILE APK VỀ ĐIỆN THOẠI:" >> $GITHUB_STEP_SUMMARY
          echo "👉 **[Bấm vào đây để tải file DiscordReactor.apk]($DIRECT_LINK)**" >> $GITHUB_STEP_SUMMARY

      - name: Tải lên GitHub Releases (Không bị giới hạn dung lượng Artifact)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Discord Auto-Reactor v1.0.0 (Android APK)"
          body: |
            ### Ứng dụng Discord Auto-Reactor cho Android (Rust Tauri v2)
            - **Dung lượng siêu nhẹ**: Tiết kiệm RAM (15 - 35 MB), tối ưu pin khi chạy nền.
            - **Cài đặt**: Tải file `DiscordReactor.apk` bên dưới về điện thoại và mở lên để cài đặt.
          files: release_apk/DiscordReactor.apk
          token: ${{ secrets.GITHUB_TOKEN }}
